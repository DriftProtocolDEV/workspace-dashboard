<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="app.webmanifest">
</head>
<body>
  <div class="app-container">
    <header>
      <div class="header-titles">
        <h1>Workspace Dashboard</h1>
        <span class="subtitle">All data stays on device</span>
      </div>
      <div class="account-select">
        <label for="account">Account:</label>
        <select id="account">
          <option>Personal (0)</option>
          <option>Work (1)</option>
        </select>
      </div>
    </header>

    <main>
      <section class="grid-section">
        <h2>Workspace Apps</h2>
        <div class="app-grid">
          <button class="app-card" onclick="window.open('https://mail.google.com/mail/u/0/', '_blank', 'width=1100,height=800,menubar=no,toolbar=no')">
            <span class="icon">📧</span>
            <span class="label">Gmail</span>
          </button>
          <button class="app-card" onclick="window.open('https://calendar.google.com/calendar/u/0/', '_blank', 'width=1100,height=800,menubar=no,toolbar=no')">
            <span class="icon">📅</span>
            <span class="label">Calendar</span>
          </button>
          <button class="app-card" onclick="window.open('https://drive.google.com/drive/u/0/', '_blank', 'width=1100,height=800,menubar=no,toolbar=no')">
            <span class="icon">☁️</span>
            <span class="label">Drive</span>
          </button>
          <button class="app-card" onclick="window.open('https://docs.google.com/document/u/0/', '_blank', 'width=1100,height=800,menubar=no,toolbar=no')">
            <span class="icon">📄</span>
            <span class="label">Docs</span>
          </button>
          <button class="app-card" onclick="window.open('https://docs.google.com/spreadsheets/u/0/', '_blank', 'width=1100,height=800,menubar=no,toolbar=no')">
            <span class="icon">📊</span>
            <span class="label">Sheets</span>
          </button>
          <button class="app-card" onclick="window.open('https://docs.google.com/presentation/u/0/', '_blank', 'width=1100,height=800,menubar=no,toolbar=no')">
            <span class="icon">📽️</span>
            <span class="label">Slides</span>
          </button>
          <button class="app-card" onclick="window.open('https://keep.google.com/u/0/', '_blank', 'width=1100,height=800,menubar=no,toolbar=no')">
            <span class="icon">🗒️</span>
            <span class="label">Keep</span>
          </button>
          <button class="app-card" onclick="window.open('https://gemini.google.com/', '_blank', 'width=1100,height=800,menubar=no,toolbar=no')">
            <span class="icon">✨</span>
            <span class="label">Gemini</span>
          </button>
        </div>
      </section>

      <section class="notes-section">
        <div class="notes-header">
          <h2>Quick Notes</h2>
          <button id="clear-btn" class="clear-btn">Clear</button>
        </div>
        <textarea id="notes-area" placeholder="Jot down ideas, tasks, or reminders. Everything is saved automatically in your browser..."></textarea>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
